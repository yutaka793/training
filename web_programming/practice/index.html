<!DOCTYPE html>
<html lang="en">

<head>
  <!-- webサイトの裏設定を記入する場所 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初のwebサイト作成</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="inner">
    <!-- 実際にユーザーの目に触れる部分 -->
    <h1>これは練習ページです</h1>
    <p>初めてのホームページ作りです。まずはhtmlファイルの中を編集してwebサイトを作成します。その後、cssデザインを学んで、javaScriptでプログラミング制御します。 </p>
    <!-- aタグはhrefという属性値でジャンプ先を示す -->
    <a href="https://github.com/yourusername" target="_blank">自分のGitHubページはこちらです</a>
    <br>
    <br>
    <br>
    <!-- src属性で画像ファイルで指名、alt属性で補足説明を記入 -->
    <!-- 自動改行はalt + shift + F -->
    <p>↓は猫の写真です</p>

    <img src="cat.png" alt="猫の画像">
  </div>
  
  <!-- script.jpという名前のJavaScriptと連動 -->

  <script src="script.js"></script>


</body>

</html>
